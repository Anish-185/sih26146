# Single source of truth for every stage. Nothing below is hardcoded elsewhere.
# NTRO's real dumps may use different field names — remap here, not in code.

schema:
  # our canonical name -> field name in the incoming dataset (NTRO's may differ)
  timestamp: timestamp
  src_ip: src_ip
  dst_ip: dst_ip
  src_port: src_port
  dst_port: dst_port
  tx_id: txid
  input_addresses: input_addresses
  output_addresses: output_addresses
  input_amounts: input_amounts
  output_amounts: output_amounts
  fee: fee
  script_type: script_type
  geo_country: geo_country
  asn: asn

ingest:
  input_dir: data/raw
  processed_dir: data/processed
  format: csv            # csv | json | xml — which file to read from a directory
  quarantine_path: data/processed/quarantine.parquet
  output_path: data/processed/transactions.parquet
  timestamp_unit: iso    # s | ms | iso
  list_separator: ";"    # how list fields are packed into a single CSV cell
  # Where output_path's rows came from: simulated | real. Nothing in a relay
  # log says whether it was generated, so it is declared here and a peer
  # profile built from it states it in its header. The demo dataset is
  # generator/ output; set `real` only for an actual case dataset.
  provenance: simulated

intel:
  # Public IP intelligence, fetched once by offline/fetch_intel.sh. Read from
  # disk only — the pipeline never touches the network.
  dir: data/intel
  known_nodes: known_bitcoin_nodes.json
  tor_exits: tor_exit_nodes.txt
  hosting_asns: hosting_asns.txt
  manifest: manifest.json
  # Synthetic stand-in written beside a generated dataset. Holds only what the
  # real world publishes (which IPs are public relays, Tor exits, hosting) —
  # never who owns what. That lives in ground_truth.json and is never read here.
  synthetic_node_intel: node_intel.json
  synthetic_watchlist: synthetic_watchlist.json
  watchlist_path: data/intel/synthetic_watchlist.json

geoip:
  country_db: data/geoip/GeoLite2-Country.mmdb
  asn_db: data/geoip/GeoLite2-ASN.mmdb
  city_db: data/geoip/GeoLite2-City.mmdb   # optional, unused for now
  # VPN / hosting / Tor-adjacent ASNs. Small starter list — expand later.
  # An IP in one of these is weak evidence of location or identity, so the
  # correlation engine discounts it.
  high_risk_asns:
    - 14061   # DigitalOcean
    - 16509   # AWS
    - 24940   # Hetzner
    - 9009    # M247
    - 208294  # Tor exit operator (example)
    - 4224    # Calyx / Tor-adjacent (example)
    - 60729   # Zwiebelfreunde (Tor)
    - 53667   # FranTech / BuyVM
    - 20473   # Vultr / Choopa
    - 63949   # Akamai (Linode)

models:
  anomaly: models/isolation_forest.joblib
  gnn: models/gnn.pt
  scaler: models/scaler.joblib

graph:
  # address clustering heuristics (reimplemented from BlockSci's published
  # definitions — see docs/vendor_notes.md; nothing is imported from vendor/)
  common_input_ownership: true
  change_detection: true
  max_hops: 4

  coinjoin:
    # common-input-ownership is skipped on transactions that look like this
    min_inputs: 3
    min_outputs: 3
    min_equal_outputs: 3        # how many outputs must share one value
    equal_value_tolerance: 0.02 # relative, so near-equal CoinJoin outputs still count
    dust_btc: 0.0000273         # BlockSci excludes dust-valued "equal" outputs

  change:
    heuristics: [address_reuse, address_type, optimal_change, peeling_chain]
    min_votes: 2                # below this the change output is left undecided
    # a tie between outputs is never resolved — guessing here corrupts clusters

  # Wallet fingerprints corroborate merges; they never make one
  # (graph.clustering.corroborate). A merge joining wallets whose spending
  # transactions carry two different confident fingerprints keeps its union
  # but has its confidence multiplied by this. Half, because one software
  # mismatch is a reason to doubt a merge, not proof it is wrong: people run
  # two wallets over one seed, and a fingerprint is itself a probability.
  fingerprint:
    corroborate: true
    mismatch_factor: 0.5

  collapse_guard:
    max_cluster_wallets: 500    # above this a cluster is flagged, not trusted
    reason: "suspicious_merge — needs review"

features:
  entity_path: data/processed/features.parquet
  transaction_path: data/processed/features_tx.parquet
  # The third grain: one row per candidate peer per txid per capture
  # (features/relay.py). Rows still identified by a wtxid go to the quarantine
  # file rather than into the matrix, following ingest/'s convention.
  relay_path: data/processed/features_relay.parquet
  relay_quarantine_path: data/processed/features_relay_quarantine.parquet

  # Wallet-construction fingerprints (features/fingerprint.py, docs/FINGERPRINTS.md).
  fingerprint:
    model_path: data/processed/fingerprint_model.json
    # Below this calibrated confidence the answer is "unknown". Rationale: at
    # 0.6 a named family is right at least 1.5 times as often as it is wrong
    # on the calibration captures. Under that, a label points an analyst at a
    # software family more often wrongly than a coin flip's margin justifies.
    # Fixed before the first evaluation and not tuned on a test capture.
    unknown_below: 0.6
    # Fewer observable tells than this and the answer is "unknown" whatever the
    # score: a transaction showing only its input/output counts and script
    # type has not shown how it was built.
    min_tells: 4
    laplace: 1.0
    # Whether the console shows fingerprints by default (the API answers
    # either way). Set by the pre-registered rule in docs/FINGERPRINTS.md
    # ("Open-set revision"): off while the leave-one-profile-out
    # harmful-mislabel rate (all tells) is above 0.10.
    console_display: false

  # "suspiciously round": a multiple of one of these, to within the tolerance
  round_units: [1.0, 0.5, 0.1, 0.05, 0.01]
  round_tolerance: 0.000000001   # sub-satoshi: absorbs float error, not a real 1-sat difference

  # velocity is txs/day; short-lived entities are not divided by a tiny window
  velocity_min_window_days: 1.0

  dormancy:
    gap_days: 30            # quiet for at least this long...
    burst_transactions: 5   # ...then this many transactions...
    burst_window_days: 1.0  # ...inside this window

engines:
  rules:
    alerts_path: data/processed/rule_alerts.parquet
    # An alert that only just meets a rule's threshold scores base_score; the
    # score climbs to 1.0 as the evidence piles up. min_score then decides what
    # is worth writing — raise it to drop borderline alerts, lower it for recall.
    min_score: 0.4
    base_score: 0.35

    ransomware_collector:
      min_senders: 5            # distinct wallets paying in
      target_senders: 25        # score saturates here
      first_time_sender_ratio: 0.6
      min_peel_hops: 2
      target_peel_hops: 8

    coinjoin:
      min_equal_outputs: 3
      target_equal_outputs: 8
      min_outputs: 3

    peel_chain:
      max_peel_ratio: 0.35      # a hop keeps most of the value, peels a little
      min_hops: 3
      target_hops: 10

    layering:
      min_fan_out: 4            # split width
      min_fan_in: 3             # merge width
      window_hours: 24
      max_hops: 6
      min_traced_inputs: 0.5    # share of the merge's inputs tracing back to the split

  gnn:
    scores_path: data/processed/gnn_scores.parquet
    # What counts as illicit when labelling from ground_truth.json. CoinJoin is
    # deliberately absent: mixing is suspicious, not by itself a crime.
    illicit_typologies: [ransomware_collector, layering]
    max_edges_per_tx: 64        # cap on the input x output expansion (CoinJoins)
    hidden: 64
    layers: 2
    dropout: 0.2
    lr: 0.005
    weight_decay: 0.0001
    epochs: 30
    seed: 42
    split: [0.6, 0.2, 0.2]      # chronological, never random
    entity_aggregation: max     # max | mean, when rolling edge scores up

  propagation:
    output_path: data/processed/tx_origins.parquet
    # Measured on generated data (tests/test_propagation.py prints the table).
    # The binding constraint is the ceiling: the true origin is only present in
    # the observed tree 20% / 34% / 63% of the time at relay-observation rates
    # 0.1 / 0.3 / 0.6. Against that ceiling first_timestamp reaches ~87%, the
    # hybrid ~65%, rumor centrality ~30% — because our origin appears as a
    # degree-1 leaf (origin -> entry node) while Shah & Zaman's estimator seeks
    # the tree's centre, a prior that fits full infected subtrees, not sparse
    # samples. All three are kept and comparable; re-measure on real data.
    estimator: first_timestamp   # first_timestamp | rumor_centrality | timestamp_weighted_centrality
    centrality_weight: 0.6      # timestamp_weighted: weight on rumor centrality
    timing_weight: 0.4          # ...and on how early the node reported
    runner_ups: 3

    # A public relay forwards thousands of other people's transactions, so its
    # presence near the root of an observed tree means almost nothing. A Tor
    # exit or a hosting address is different: when a broadcast is masked, that
    # address IS where it entered the network. Penalising it in the ranking
    # pushes the estimator off the right answer, so the split configuration
    # penalises only relays and handles the other two by labelling them an
    # anonymized entry point and discounting the attribution confidence handed
    # to the correlation engine. See docs/detection_unit_protocol.md.
    origin_filter:
      mode: split          # off | combined | split — eval reports all three
      variants:
        "off":            # quoted: bare off is a YAML boolean
          known_bitcoin_relay: 1.0
          tor_exit: 1.0
          hosting_vpn: 1.0
          residential_or_unknown: 1.0
        combined:          # the old filter: everything shared is penalised
          known_bitcoin_relay: 0.05
          tor_exit: 0.2
          hosting_vpn: 0.3
          residential_or_unknown: 1.0
        split:
          known_bitcoin_relay: 0.05
          tor_exit: 1.0
          hosting_vpn: 1.0
          residential_or_unknown: 1.0
      anonymized_entry_classes: [tor_exit, hosting_vpn]
      # An anonymized entry point is a real observation about the transaction
      # and a poor one about the person: the estimate keeps its rank and its
      # confidence, but only this share of it counts as attribution evidence.
      attribution_confidence_factor: 0.4
      # Cost of each origin outcome, pre-registered. Being wrong out loud costs
      # three times what being right is worth; abstaining is free.
      cost_weights:
        correct_actionable: 1.0
        correct_infrastructure: 0.3
        wrong_uninvolved_third_party: -3.0
        abstained: 0.0
        # The metric revision, pre-registered with a rationale for each in
        # docs/VALIDITY.md §"Metric revision" before any rerun. Not tuned.
        qualified_correct: 0.3              # = correct_infrastructure: right, not IP-actionable
        qualified_wrong: -1.0               # the same ~1/3 scaling as 0.3 / 1.0
        coinjoin_input_misattribution: -3.0 # = wrong_uninvolved_third_party: a false ownership claim

    single_row_confidence: 0.15   # one observation is a guess, not an estimate

    # low_confidence_origin (formerly origin_likely_unobserved — the old name
    # asserted the true origin was absent, which it cannot know; what it
    # measures is that this estimate is weak). Set when the top candidate is a
    # public relay, or when confidence is below the cutoff.
    # Cutoff chosen on seed A by the rule in docs/detection_unit_protocol.md
    # and reported unchanged on seed B; see eval/results.md.
    low_confidence_cutoff: 0.35
    # Only public relays. Tor exits and hosting addresses were in this list
    # until it was measured: when a broadcast is masked, those ARE the origin,
    # and top candidates in those classes are correct 62-63% of the time.
    # Flagging them made the flag worse. A Bitnodes-listed relay is different —
    # it forwards other people's traffic and is never a plausible sender.
    low_confidence_classes: [known_bitcoin_relay]

  anomaly:
    scores_path: data/processed/anomaly_scores.parquet
    # Score within peer groups, so an exchange is compared with exchanges.
    # Scored against the whole population, the biggest legitimate businesses
    # are always the biggest outliers and the signal inverts.
    peer_groups:
      by: [txs, value_out]
      quantiles: [0.5, 0.9, 0.99]   # -> 4 buckets per dimension pair
      min_group: 30                 # smaller groups fall back to the global fit
    # IsolationForest over the entity feature table. Unsupervised on purpose:
    # unlike the GNN it needs no labels, so it is the engine that still works
    # on NTRO's real unlabelled data.
    contamination: 0.05
    n_estimators: 200
    # Cores used to build the forest. Measured, not assumed: on this workload
    # (a few small peer groups of a few hundred rows) one core is the fastest —
    # 1.51s against 2.29s on all cores, because joblib's overhead per group
    # exceeds the work in it. The scores are identical either way, since
    # random_state is fixed. See docs/redteam_performance.md.
    n_jobs: 1
    seed: 42
    features: [fan_in_ratio, fan_out_ratio, round_amount_ratio, velocity,
               lifetime_days, counterparties_in, counterparties_out, txs,
               value_in, value_out, unique_broadcast_ips, unique_asns,
               max_burst_transactions]

  correlation:
    output_path: data/processed/ip_correlation.parquet

    # Which IP counts as the broadcaster is decided by engines/propagation,
    # not by whichever hop happened to be recorded first. Each observation is
    # then weighted by that estimate's confidence before it counts as evidence.
    saturation_k: 2             # raw_confidence = 1 - exp(-effective_observations / k)
    # Leads are ranked and shown top-k per entity, so there is no score floor to
    # tune — the old min_score was calibrated to a scale that no longer exists.
    high_risk_asn_factor: 0.2   # VPN / hosting / Tor-adjacent ASN
    shared_ip:
      free_entities: 3          # an IP tied to this many clusters is not penalised
      min_factor: 0.02          # floor, so a link is weakened but never erased

    # The reverse direction: peer -> behavioural profile (profile.py).
    profile:
      # Below this many announcements a peer gets no timing signature, only a
      # sentence saying so. Rationale: the standard error of an inter-arrival
      # standard deviation is about sd/sqrt(2(n-1)) — 16% at 20 announcements,
      # 50% at 3 — and an active-hours histogram over 24 bins from fewer than
      # 20 events is mostly empty bins, which reads as a schedule it is not.
      # Fixed from that arithmetic, not tuned on any profile.
      min_timing_observations: 20
      relayed_sample: 10          # relayed transactions listed; the rest are counted
      evidence_rows: 20           # raw rows listed per linked cluster; the rest counted

risk_weights:
  rules: 0.35
  anomaly: 0.25
  gnn: 0.25
  correlation: 0.15

eval:
  # The one canonical evaluation setup. Every number in eval/results.md comes
  # from these settings via `python -m eval.report` — no ad-hoc runs.
  seed: 41
  n_actors: 200
  n_transactions: 1200
  observation_rates: [0.1, 0.3, 0.6]
  default_rate: 0.3
  # Seed A chooses thresholds; seed B only ever reports them. Never swapped.
  seed_b: 43
  # The GNN must never be evaluated on what it was trained on. The demo dataset
  # in data/raw uses seed 41 — the same as seed A — so a GNN trained the obvious
  # way would be scored here against its own training set. Train it on this seed
  # instead; `eval.report` refuses to use a model whose recorded training seed
  # is one of the eval seeds, and says so in the report.
  gnn_train_seed: 11
  # Red-team batch: injections driven through api.redteam.execute, the same code
  # path POST /redteam/runs uses.
  redteam_runs: 50
  work_dir: data/processed/eval
  results_path: eval/results.md
  calibration_bins: 5

  ground_truth:
    # Origin accuracy against known truth on real relay data (eval/ground_truth/).
    # Protocol pre-registered in docs/GROUND_TRUTH.md, committed before any
    # signet number existed.
    fixtures_dir: tests/fixtures/ground_truth
    # Preflight thresholds. Each one refuses a capture rather than warning:
    # a warning in a log is not a number an investigator will decline to quote.
    min_subsecond_share: 0.5      # logtimemicros=1, or a pcap
    max_unresolved_wtxid_share: 0.05   # after the label file has resolved what it can
    wilson_z: 1.96                # 95% intervals; the samples are dozens, not thousands
    # The observer's clock resolution, used for the timing ceiling: two
    # announcements closer together than this cannot be ordered at all.
    clock_resolution_seconds: 0.000001
    delta_percentiles: [50, 90, 99]
    # Defaults for a broadcast run on the collection host.
    n_transactions: 50
    interval_seconds: 20.0

origination:
  # The supervised per-(txid, peer) model. Corpus: origination/manifest.json;
  # results: docs/ORIGINATION_RESULTS.md and eval/results.md section 9.
  corpus_dir: data/processed/eval/origination
  model_path: data/processed/origination_model.pkl
  output_path: data/processed/tx_origination.parquet
  results_doc: docs/ORIGINATION_RESULTS.md
  # Fixed before any result existed and not tuned afterwards. Tuning these
  # until the cross-topology row looked better would turn the test set into a
  # validation set.
  gbm:
    max_iter: 300
    learning_rate: 0.05
    max_leaf_nodes: 15
    min_samples_leaf: 40
    l2_regularization: 1.0
  ece_bins: 10
  explain_top_features: 3

validity:
  # analysis/validity.py — conditions under which an origin attribution is
  # invalid. A failed check forces abstention through low_confidence_origin /
  # eval.origin.flagged_at; `enforce: false` switches it off there (the
  # no-abstention floor, and the "without validity" comparison).
  enforce: true
  # tiered: only ABSTAIN withholds; QUALIFIED restricts what the answer claims;
  # ANNOTATE flags. binary: P6's gate, every non-PASS verdict abstains.
  mode: tiered
  results_doc: docs/VALIDITY.md
  dandelion:
    # Fixed before the first result, from the shape a stem leaves rather than
    # from the data: a lone first announcement followed by a burst. Not tuned.
    min_candidates: 4           # at least two gaps after the first
    isolation_ratio: 5.0        # first gap / median later gap

fusion:
  alerts_parquet: data/processed/final_alerts.parquet
  # Analyst verdicts from the API, for recalibrating fusion/stacker.py later.
  feedback_parquet: data/processed/feedback.parquet
  # Saved investigation views (the graph the analyst actually built).
  investigations_dir: data/processed/investigations
  alerts_json: data/processed/final_alerts.json
  # Actors (fusion/actors.py, docs/ACTORS.md): clusters joined to peer
  # identities. Written beside the alerts by `python -m fusion.pipeline`.
  actors_json: data/processed/final_actors.json
  model_path: models/stacker.joblib
  alert_threshold: 0.5        # composite score above which an alert is explained
  leads_per_entity: 3         # top-k IP attribution leads shown per alert

  taint:
    decay_per_hop: 0.5        # suspicion halves at every hop from the seed
    max_hops: 4               # beyond this, taint says nothing useful
    # Seeds come from the analyst watchlist ONLY. Seeding from our own rules
    # engine made taint a copy of the rules' output: it scored AUC 0.999 alone
    # while predicting nothing the rules had not already found.
    watchlist_weight: 1.0
    min_taint: 0.01
    follow: outgoing          # outgoing | both — taint flows with the money

  stacker:
    # correlation_score is deliberately absent: an IP correlation is an
    # attribution lead about *who*, not evidence that an entity is risky.
    # It is surfaced per alert under "leads" instead.
    signals: [rule_score, anomaly_score, gnn_score, taint_score]
    non_negative: true          # every signal may only ever raise risk
    seed: 42
    test_fraction: 0.3        # chronological hold-out, never random
    max_iter: 2000

thresholds:
  low: 0.3
  medium: 0.6
  high: 0.8

monitor:
  # Live monitoring watches this directory and scores what lands in it.
  # Anything an operator can copy a file into works: a share, a USB mount, the
  # output directory of an upstream capture.
  inbox_dir: data/inbox
  # Handled files are moved here, never deleted — the custody ledger points at
  # them, so removing one would destroy the evidence the record refers to.
  archive_dir: data/processed/monitor_archive
  scratch_dir: data/processed/monitor_scratch
  poll_seconds: 2.0
  # A file is only read once its size has stopped changing, so a writer still
  # copying into the directory is not parsed half-written.
  settle_seconds: 0.4

p2p:
  # Real Bitcoin P2P relay observations, read from files (p2p/capture_reader.py).
  # Nothing here opens a socket: a capture is produced on a collection host by
  # bitcoind or tcpdump and carried across the air gap — see docs/CAPTURE.md.
  capture_dir: data/capture
  port: 8333
  # Magics we resynchronise a desynchronised TCP stream on: main, testnet3,
  # signet, regtest. Any other value in a capture is not a stream we understand.
  network_magics: [f9beb4d9, 0b110907, 0a03cf40, fabfb5da]
  # The capture host's own addresses, which decide inbound from outbound. Left
  # empty the reader infers it as the address common to every flow — true for a
  # capture taken on the node itself, false on a span port or a multi-homed
  # host, which is exactly when to fill this in.
  local_ips: []
  # How much of the `direction` column is evidence rather than assumption. The
  # direction on a relay event is always inferred — from which end of a pcap
  # flow was local, or from the verb on a debug.log line — so what varies is how
  # the observer's own address was established, and that is what is scored here.
  direction_confidence:
    explicit: 1.0                 # passed in by the operator running the build
    label_file: 1.0               # recorded by the broadcaster at capture time
    "config:p2p.local_ips": 0.9   # a standing statement about the deployment

custody:
  # The chain-of-custody ledger: append-only, hash-chained, tamper-evident.
  # See custody.py and docs/chain_of_custody.md.
  ledger_path: data/processed/custody.jsonl
  # Who the ledger says did the work. This build has no authentication, so it
  # says so rather than inventing a name a court would later have to test.
  actor: "btc-intel (unauthenticated demo build)"

redteam:
  # Where the dataset is copied before the first injection of a session, and
  # what `POST /redteam/reset` restores it from.
  snapshot_dir: data/processed/redteam_snapshot

api:
  host: 127.0.0.1
  port: 8000
  # Local frontend dev only. A real deployment terminates TLS and authenticates
  # in front of this, and this list stops being a wildcard.
  cors_origins: ["http://localhost:5173", "http://127.0.0.1:5173",
                 "http://localhost:3000", "http://127.0.0.1:3000"]
  page_size: 50          # default /alerts page
  max_page_size: 200
  graph_hops: 2          # default radius of /entities/{id}/graph
  max_graph_nodes: 300   # cut-off, so the browser is never asked to draw a hairball

offline: true   # no network calls anywhere in the pipeline

generator:
  start_time: "2026-01-01T00:00:00Z"
  seconds_between_txs: 12          # mean gap; actual gaps are exponential
  script_types: [p2wpkh, p2pkh, p2sh, p2wsh, p2tr]
  script_type_weights: [0.55, 0.15, 0.12, 0.08, 0.10]
  fee_btc: [0.00002, 0.0009]       # uniform range
  round_payment_rate: 0.18         # share of payments a human typed as a round number
  round_units: [1.0, 0.5, 0.1, 0.05, 0.01]
  exchange_share: 0.02             # fraction of base actors that are exchanges
  nat_share_rate: 0.15             # fraction of base actors sharing a NAT/VPN IP (innocent)
  nat_pool_size: 40                # how many shared IPs exist
  wallets_per_actor: [1, 3]

  # --shifted: the same typologies, deformed. A detector tuned to the standard
  # set should not fall over here, and the shifted numbers are the headline.
  shift:
    peel_ratio_jitter: 0.6        # multiplies the configured peel fraction range
    extra_hops: [1, 6]            # added to layering depth / peel chain length
    delay_multiplier: [2.0, 8.0]  # instances spread over a longer window
    mixed_pattern_rate: 0.35      # chance an instance is followed by a CoinJoin

  # ~10% of illicit wallets are "already known" to the analyst. Taint seeds from
  # this list only — never from our own rules engine, which would make taint a
  # copy of the rules' output rather than an independent signal.
  watchlist_fraction: 0.1

  # fraction of transactions each typology should account for (normalised)
  pattern_mix:
    normal: 0.86
    ransomware_collector: 0.04
    layering: 0.04
    same_actor_cluster: 0.03
    coinjoin: 0.03

  # A typology instance is spread over a window instead of being emitted
  # back-to-back, the way AMLSim gives each pattern a period. Without this the
  # inter-transaction gap alone gives the label away and every model trained on
  # this data reports inflated accuracy. Window = n_txs * gap * spread_factor.
  typology_spread_factor: 20

  typology_params:
    ransomware_collector:
      victims: [15, 60]
      peel_hops: [4, 12]
      ransom_btc: [0.01, 0.35]
      round_ransom_rate: 0.8       # ransom demands are quoted as round figures
      peel_fraction: [0.05, 0.2]
    layering:
      fan: [4, 10]
      depth: [2, 4]
      amount_btc: [1.0, 40.0]
    same_actor_cluster:
      spread_factor: 0          # must stay bursty: one IP, one short window
      wallets: [3, 8]
      window_seconds: 900
      amount_btc: [0.05, 3.0]
    coinjoin:
      participants: [5, 12]
      denomination_btc: [0.01, 0.1, 0.5, 1.0]

  # how a broadcast is observed: home IP, or masked
  broadcast:
    tor_rate: 0.05
    hosting_rate: 0.08

  # example ASN ranges — swap for DB-IP Lite data later
  asn_pools:
    residential:
      - {asn: 9829, name: BSNL, country: IN, prefix: "117.200"}
      - {asn: 55836, name: RJIL, country: IN, prefix: "49.36"}
      - {asn: 24560, name: Airtel, country: IN, prefix: "122.176"}
      - {asn: 7922, name: Comcast, country: US, prefix: "73.14"}
      - {asn: 3320, name: DTAG, country: DE, prefix: "91.65"}
    hosting:
      - {asn: 14061, name: DigitalOcean, country: US, prefix: "159.65"}
      - {asn: 16509, name: AWS, country: US, prefix: "52.66"}
      - {asn: 24940, name: Hetzner, country: DE, prefix: "88.99"}
      - {asn: 9009, name: M247, country: NL, prefix: "185.107"}
    tor_exit:
      - {asn: 208294, name: TorExit, country: DE, prefix: "185.220"}
      - {asn: 4224, name: CalyxTor, country: US, prefix: "162.247"}

  # Wallet-construction profiles (generator/wallets.py; tells and their basis in
  # docs/FINGERPRINTS.md). OFF unless `generator.main --wallet-profiles` or a
  # corpus manifest with a `fingerprint` block asks for them: every draw comes
  # from its own stream, so with profiles off the output is byte-identical to
  # what it was (pinned in tests/test_fingerprint.py). Each value is a
  # probability map drawn per transaction. These are this simulation's
  # stand-ins for the families named, not measurements of them: which parts
  # are documented behaviour and which are assumptions is in the doc.
  wallet_profiles:
    start_height: 850000            # block height at the simulated clock's start
    payment_mix: {core_like: 0.45, electrum_like: 0.30, legacy_naive: 0.25}
    payee_types: {p2wpkh: 0.50, p2tr: 0.20, p2sh: 0.15, p2pkh: 0.15}
    profiles:
      core_like:
        version: {2: 1.0}
        anti_fee_sniping: 0.95      # nLockTime = height, else 0
        rbf: 0.9                    # nSequence 0xFFFFFFFD
        bip69: 0.0
        change_position: {random: 1.0}
        fee: {fractional: 1.0}
        input_types: {p2wpkh: 0.6, p2tr: 0.4}
        change_type: {match_inputs: 1.0}
      electrum_like:
        version: {2: 1.0}
        anti_fee_sniping: 0.9
        rbf: 0.85
        bip69: 0.85
        change_position: {random: 1.0}
        fee: {integer: 0.8, fractional: 0.2}
        input_types: {p2wpkh: 0.85, p2sh: 0.15}
        change_type: {match_inputs: 1.0}
      legacy_naive:
        version: {1: 0.9, 2: 0.1}
        anti_fee_sniping: 0.0
        rbf: 0.0
        bip69: 0.0
        change_position: {last: 0.9, random: 0.1}
        fee: {absolute: 0.85, fractional: 0.15}
        input_types: {p2pkh: 0.8, p2sh: 0.2}
        change_type: {reuse_input: 0.7, match_inputs: 0.3}
      coordinator_coinjoin:
        version: {1: 0.5, 2: 0.5}
        anti_fee_sniping: 0.0
        rbf: 0.0
        bip69: 0.3
        change_position: {random: 1.0}
        fee: {integer: 0.7, fractional: 0.3}
        input_types: {p2wpkh: 0.7, p2tr: 0.3}
        change_type: {match_inputs: 1.0}
        participant_change: 0.8     # share of participants given a change output
      batch_withdrawal:
        version: {2: 0.7, 1: 0.3}
        anti_fee_sniping: 0.2
        rbf: 0.1
        bip69: 0.0
        change_position: {last: 0.7, random: 0.3}
        fee: {round: 0.7, integer: 0.3}
        input_types: {p2wpkh: 0.6, p2sh: 0.4}
        change_type: {match_inputs: 1.0}

gossip:
  n_nodes: 500
  # A real sender is a node with its own peers, announcing to all of them —
  # not a wallet attached to the network by a single link. Bitcoin Core makes
  # 8 outbound connections by default; light clients make fewer.
  origin_peers: [4, 12]           # full-node sender: peers it announces to
  light_client_share: 0.25        # share of senders that are light clients
  light_client_peers: [1, 3]
  n_relays: 40                     # high-degree public relay nodes
  relay_asn_pool: hosting
  tor_node_share: 0.06             # share of gossip nodes that are Tor exits
  hosting_node_share: 0.25
  peer_degree: 8
  relay_bias: 0.6                  # probability a peer link prefers a relay node
  delay_mean_ms: 150               # exponential forwarding delay
  max_hops_per_tx: 12              # cap on simulated forwarding events per tx
  relay_observation_rate: 0.3      # fraction of hops that appear in the output
  p2p_port: 8333
  ephemeral_ports: [32768, 60999]
